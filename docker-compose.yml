services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - PLEX_CLAIM=${PLEX_CLAIM}
    volumes:
      - ./plex/config:/config
      - /mnt/Public/Media/Movies:/media/Movies
      - /mnt/Public/Media/TV Shows:/media/TV Shows
    restart: unless-stopped

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    network_mode: host
    environment:
      - TZ=${TZ}
    volumes:
      - ./homeassistant/config:/config
    depends_on:
      - mosquitto
    restart: unless-stopped

  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8080:80/tcp"
    environment:
      - TZ=${TZ}
      - WEBPASSWORD=${PIHOLE_PASSWORD}
      - FTLCONF_LOCAL_IPV4=${HOST_IP}
    volumes:
      - ./pihole/etc-pihole:/etc/pihole
      - ./pihole/etc-dnsmasq.d:/etc/dnsmasq.d
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: unless-stopped

  go2rtc:
    image: alexxit/go2rtc:latest
    container_name: go2rtc
    ports:
      - "1984:1984"
      - "8554:8554"
      - "8555:8555/tcp"
      - "8555:8555/udp"
    environment:
      - REOLINK_DOORBELL_USER=${REOLINK_DOORBELL_USER}
      - REOLINK_DOORBELL_PASS=${REOLINK_DOORBELL_PASS}
      - REOLINK_DOORBELL_UID=${REOLINK_DOORBELL_UID}
      - REOLINK_GARAGE_USER=${REOLINK_GARAGE_USER}
      - REOLINK_GARAGE_PASS=${REOLINK_GARAGE_PASS}
      - REOLINK_LIVING_ROOM_USER=${REOLINK_LIVING_ROOM_USER}
      - REOLINK_LIVING_ROOM_PASS=${REOLINK_LIVING_ROOM_PASS}
    volumes:
      - ./go2rtc/config:/config
    restart: unless-stopped

  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable
    container_name: frigate
    privileged: true
    shm_size: "256mb"
    ports:
      - "5000:5000"
      - "8971:8971"
    environment:
      - FRIGATE_MQTT_PASSWORD=
    volumes:
      - ./frigate/config:/config
      - /mnt/Cameras:/media/frigate
      - /etc/localtime:/etc/localtime:ro
    devices:
      - /dev/dri:/dev/dri
    depends_on:
      - mosquitto
      - go2rtc
    restart: unless-stopped
