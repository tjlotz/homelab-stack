services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - PLEX_CLAIM=${PLEX_CLAIM}
    volumes:
      - ./plex/config:/config
      - ./scripts:/scripts:ro
      - /mnt/Public/Media/Movies:/media/Movies
      - /mnt/Public/Media/TV Shows:/media/TV Shows
    # Wait for NAS mounts before starting (prevents unavailability issues)
    entrypoint: /scripts/wait-for-mounts.sh
    restart: unless-stopped

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    network_mode: host
    environment:
      - TZ=${TZ}
    volumes:
      - ./homeassistant/config:/config
    depends_on:
      - mosquitto
    restart: unless-stopped

  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8080:80/tcp"
    environment:
      - TZ=${TZ}
      - WEBPASSWORD=${PIHOLE_PASSWORD}
      - FTLCONF_LOCAL_IPV4=${HOST_IP}
    volumes:
      - ./pihole/etc-pihole:/etc/pihole
      - ./pihole/etc-dnsmasq.d:/etc/dnsmasq.d
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: unless-stopped

  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable
    container_name: frigate
    network_mode: host
    privileged: true
    shm_size: "256mb"
    environment:
      - FRIGATE_RTSP_USER=${REOLINK_USER}
      - FRIGATE_RTSP_PASSWORD=${REOLINK_PASS}
      - FRIGATE_MQTT_USER=${MQTT_USER}
      - FRIGATE_MQTT_PASSWORD=${MQTT_PASS}
    volumes:
      - ./frigate/config:/config
      - /mnt/Cameras:/media/frigate
      - /etc/localtime:/etc/localtime:ro
    devices:
      - /dev/dri:/dev/dri
    depends_on:
      - mosquitto
    restart: unless-stopped
