# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# Reolink camera integration for PTZ controls
# Provides camera entities and PTZ controls for E1 Pro cameras
reolink:
  host:
    - name: Garage E1 Pro
      host: 192.168.1.11
    - name: Living Room E1 Pro
      host: 192.168.1.12
    - name: Office E1 Pro
      host: 192.168.1.13

# Enable built-in go2rtc for RTSP restreaming
go2rtc:

# YAML-mode dashboards. The default UI dashboard remains UI-managed; the
# iOS Hub dashboard is sourced from dashboards/ios-hub.yaml so it can be
# version-controlled in this repo.
lovelace:
  mode: storage
  dashboards:
    ios-hub:
      mode: yaml
      title: Home
      icon: mdi:home-variant
      show_in_sidebar: true
      filename: dashboards/ios-hub.yaml
