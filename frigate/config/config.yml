mqtt:
  host: mosquitto
  port: 1883

ffmpeg:
  hwaccel_args: preset-vaapi

detectors:
  default:
    type: openvino
    device: AUTO
    model:
      path: /openvino-model/ssdlite_mobilenet_v2.xml

detect:
  width: 640
  height: 480
  fps: 5

objects:
  track:
    - person
    - cat
    - dog

record:
  enabled: true
  retain:
    days: 0
    mode: all
  events:
    retain:
      default: 14
      mode: active_objects

snapshots:
  enabled: true
  retain:
    default: 14

cameras:
  doorbell:
    ffmpeg:
      inputs:
        - path: rtsp://go2rtc:8554/doorbell_main
          input_args: preset-rtsp-restream
          roles:
            - record
        - path: rtsp://go2rtc:8554/doorbell_sub
          input_args: preset-rtsp-restream
          roles:
            - detect

  garage:
    ffmpeg:
      inputs:
        - path: rtsp://go2rtc:8554/garage_main
          input_args: preset-rtsp-restream
          roles:
            - record
        - path: rtsp://go2rtc:8554/garage_sub
          input_args: preset-rtsp-restream
          roles:
            - detect

  living_room:
    ffmpeg:
      inputs:
        - path: rtsp://go2rtc:8554/living_room_main
          input_args: preset-rtsp-restream
          roles:
            - record
        - path: rtsp://go2rtc:8554/living_room_sub
          input_args: preset-rtsp-restream
          roles:
            - detect
