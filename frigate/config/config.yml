mqtt:
  host: 192.168.1.2
  port: 1883

ffmpeg:
  hwaccel_args: preset-vaapi

detectors:
  default:
    type: openvino
    device: AUTO
    model:
      path: /openvino-model/ssdlite_mobilenet_v2.xml

detect:
  width: 640
  height: 480
  fps: 5

objects:
  track:
    - person
    - cat
    - dog

record:
  enabled: true
  retain:
    days: 0
    mode: all
  events:
    retain:
      default: 14
      mode: active_objects

snapshots:
  enabled: true
  retain:
    default: 14

cameras:
  garage:
    ffmpeg:
      inputs:
        - path: rtsp://192.168.1.2:8554/01KPKSRWT1AMB9R6R0HJB05SZ1_main
          input_args: preset-rtsp-restream
          roles:
            - record
        - path: rtsp://192.168.1.2:8554/01KPKSRWT1AMB9R6R0HJB05SZ1_sub
          input_args: preset-rtsp-restream
          roles:
            - detect

  living_room:
    ffmpeg:
      inputs:
        - path: rtsp://192.168.1.2:8554/01KPKST9VTEMJ2A682S7ZAV9DV_main
          input_args: preset-rtsp-restream
          roles:
            - record
        - path: rtsp://192.168.1.2:8554/01KPKST9VTEMJ2A682S7ZAV9DV_sub
          input_args: preset-rtsp-restream
          roles:
            - detect
